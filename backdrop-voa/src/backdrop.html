<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Backdrop VOA</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--cx:#ff6a1a;--ag:#19b85a;--mz:#1e6bff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#12093a}
body{font-family:'Be Vietnam Pro',sans-serif;position:relative;color:#fff}
.bg{position:absolute;inset:0;overflow:hidden;
  background:
   radial-gradient(900px 700px at 0% 100%, #ff2e8a 0%, transparent 60%),
   radial-gradient(800px 650px at 100% 0%, #00d4ff 0%, transparent 60%),
   radial-gradient(700px 600px at 55% 115%, #ffb300 0%, transparent 60%),
   radial-gradient(700px 520px at 10% 0%, #7b2cff 0%, transparent 65%),
   radial-gradient(650px 520px at 100% 100%, #00e0a0 0%, transparent 60%),
   linear-gradient(135deg,#2a0f7a 0%,#1a0a55 45%,#0c2a7a 100%);}
.bg::before{content:"";position:absolute;inset:-20%;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 46px);
  mask:linear-gradient(180deg,transparent,#000 40%,transparent)}
.ring{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.18)}
.dots{position:absolute;width:260px;height:260px;
  background:radial-gradient(circle,rgba(255,255,255,.35) 2.5px,transparent 3px) 0 0/22px 22px}
.streak{position:absolute;height:6px;border-radius:6px;transform:rotate(-24deg)}
/* header */
.top{position:absolute;left:70px;right:70px;top:40px;height:140px;display:flex;align-items:center;justify-content:space-between}
.welcome .k{font-size:26px;font-weight:700;letter-spacing:6px;color:#ffe066}
.welcome h1{font-size:92px;line-height:1;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,#fff 0%,#ffe066 45%,#ff8ac2 100%);-webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.welcome .t{margin-top:10px;font-size:30px;font-weight:600;color:#e8f4ff}
.welcome .t b{color:#7ff0ff}
.tlqt{background:#fff;border-radius:26px;padding:14px 28px 14px 18px;box-shadow:0 14px 40px rgba(0,0,0,.35);display:flex;align-items:center;gap:18px}
.tlqt .em{height:128px;display:block}.tlqt .wd{height:62px;display:block}

/* cards */
.cards{position:absolute;left:60px;right:60px;top:210px;bottom:96px;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:30px}
.card{position:relative;background:#fff;border-radius:34px;color:#10214a;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;border:4px solid rgba(255,255,255,.9)}
.head{height:112px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:22px 28px;background:#fff}
.head .logo{height:62px}
.certs{height:34px;filter:brightness(0) saturate(100%) invert(18%) sepia(40%) saturate(2000%) hue-rotate(210deg)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--stage)}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 55%,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.chip{background:#fff;border-radius:18px;padding:10px 20px;box-shadow:0 8px 20px rgba(0,0,0,.25);display:inline-flex;align-items:center;position:relative}
.lbl{font-size:28px;font-weight:800;color:#fff;line-height:1.2;text-shadow:0 3px 10px rgba(0,0,0,.35);position:relative}
.shadow{filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
/* curexo */
.cx{--stage:linear-gradient(165deg,#ffa04a 0%,#ff5a5a 45%,#c42a78 100%)}
.cx .stage{align-items:center;text-align:center;padding:24px 20px 20px;gap:14px}
.cx .chip img{height:74px}
.cx .robot{flex:1 1 0;height:0;min-height:0;max-width:100%;object-fit:contain;position:relative}
/* allgens */
.ag{--stage:linear-gradient(170deg,#0fb38a 0%,#0a7f86 55%,#0a4f7a 100%)}
.ag .head .logo{height:76px}.ag .head .certs{height:28px}
.prod{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:14px 18px;position:relative}
.prod+.prod{border-top:2px solid rgba(255,255,255,.25)}
.prod .chip img{height:52px}
.prod .pi{height:128px;max-width:100%;object-fit:contain;position:relative}
/* mantiz */
.mz{--stage:linear-gradient(170deg,#e4ecff 0%,#efe6ff 100%)}
.mz .stage::before{display:none}
.mz .stage.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:0}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;min-height:0}
.cell:nth-child(odd){border-right:2px solid #fff}.cell:nth-child(-n+2){border-bottom:2px solid #fff}
.cell .pl{height:44px}.cell .pl.tall{height:54px}
.cell .imgs{display:flex;justify-content:center;align-items:center;gap:10px;height:130px;width:100%}
.cell .imgs img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(40,30,110,.35))}
.cell .imgs img:first-child:nth-last-child(2),.cell .imgs img:nth-child(2){max-width:47%}
.cell .txt{font-size:26px;font-weight:800;color:#1d2b5c;line-height:1.2}
.ag .head{justify-content:flex-start;gap:12px;padding:22px 22px}.ag .head .certs{margin-left:auto}
.cap{position:relative;text-align:center;padding-top:14px;font-size:20px;font-weight:800;letter-spacing:5px;color:#c9fff0}
.certs-row{margin-left:auto;display:flex;align-items:center;gap:18px;flex:none}
.certs-row .wm{height:40px}
.certs-row .bd{height:72px}
/* footer */
.foot{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:center;gap:22px;
  background:rgba(10,6,40,.55);border-top:1px solid rgba(255,255,255,.18)}
.foot .l{font-size:20px;font-weight:700;letter-spacing:3px;color:#ffe9a8}
.foot .p{font-size:34px;font-weight:800;letter-spacing:2px}
.foot .sep{width:3px;height:48px;background:rgba(255,255,255,.5)}
.foot .s{font-size:26px;font-weight:600}
</style></head><body>
<div class="bg">
  <div class="ring" style="width:520px;height:520px;right:-160px;top:-200px"></div>
  <div class="ring" style="width:340px;height:340px;right:-60px;top:-110px;border-color:rgba(255,224,102,.35)"></div>
  <div class="ring" style="width:620px;height:620px;left:-280px;bottom:-330px;border-color:rgba(255,138,194,.35)"></div>
</div>

<div class="top">
  <div class="welcome">
    <div class="k">CHÀO MỪNG QUÝ ĐẠI BIỂU THAM DỰ</div>
    <h1>HỘI NGHỊ VOA</h1>
  </div>
  <div class="tlqt"><img class="em" src="img/tl_emblem.png" alt=""><img class="wd" src="img/tl_word.png" alt="Dịch vụ Y Khoa Thăng Long Quốc Tế"></div>
</div>

<div class="cards">
  <div class="card cx">
    <div class="head"><img class="logo" src="img/43.png" alt="Curexo"><div class="certs-row"><img class="wm" src="img/c_ce.png" alt="CE"><img class="wm" src="img/c_fda.png" alt="FDA"></div></div>
    <div class="stage">
      <span class="chip"><img src="img/38.png" alt="CUVIS Spine"></span>
      <span class="lbl">Robot định vị phẫu thuật cột sống</span>
      <img class="robot shadow" src="img/37.png" alt="">
    </div>
  </div>

  <div class="card ag">
    <div class="head"><img class="logo" src="img/35.png" alt="Allgens"><div class="certs-row"><img class="wm" src="img/c_fda.png" alt="FDA"><img class="wm" src="img/c_iso.png" alt="ISO"></div></div>
    <div class="stage">
      <div class="cap">XƯƠNG NHÂN TẠO</div>
      <div class="prod"><span class="chip"><img src="img/23.png" alt="BonGold"></span><img class="pi shadow" src="img/40.png" alt=""><span class="lbl">Chấn thương chỉnh hình</span></div>
      <div class="prod"><span class="chip"><img src="img/34.png" alt="Skulheal"></span><img class="pi shadow" src="img/36.png" alt=""><span class="lbl">Ngoại thần kinh</span></div>
    </div>
  </div>

  <div class="card mz">
    <div class="head"><img class="logo" src="img/19.png" alt="Mantiz"><div class="certs-row"><img class="bd" src="img/c_iso13485.png" alt="ISO 13485:2016"><img class="bd" src="img/c_gmp.png" alt="GMP"></div></div>
    <div class="stage grid">
      <div class="cell"><img class="pl tall" src="img/24.png"><div class="imgs"><img src="img/25.png"><img src="img/26.png"></div><div class="txt">Lồng thắt lưng in 3D</div></div><div class="cell"><img class="pl tall" src="img/27.png"><div class="imgs"><img src="img/28.png"><img src="img/29.png"></div><div class="txt">Lồng cổ in 3D</div></div><div class="cell"><img class="pl" src="img/30.png"><div class="imgs"><img src="img/31.png"></div><div class="txt">Vít cuống sống</div></div><div class="cell"><img class="pl tall" src="img/32.png"><div class="imgs"><img src="img/33.png"></div><div class="txt">Vít qua da ít xâm lấn</div></div>
    </div>
  </div>
</div>

<div class="foot">
  <span class="l">LIÊN HỆ</span><span class="p">0916 899 322</span>
</div>
</body></html>
